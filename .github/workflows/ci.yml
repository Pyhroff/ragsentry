name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  cross-repo-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ragsentry

      - uses: actions/checkout@v4
        with:
          repository: Pyhroff/agent-test-range
          path: agent-test-range
          token: ${{ secrets.TOOLS_PAT }}

      - uses: actions/checkout@v4
        with:
          repository: Pyhroff/mcpaudit
          path: mcpaudit
          token: ${{ secrets.TOOLS_PAT }}

      - uses: actions/checkout@v4
        with:
          repository: Pyhroff/memsentry
          path: memsentry
          token: ${{ secrets.TOOLS_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install this commit's ragsentry alongside the other two scanners
        run: |
          pip install -e ragsentry -e mcpaudit -e memsentry

      - name: Run agent-test-range's regression harness against this commit
        run: |
          cd agent-test-range
          python3 scripts/run_range.py
